name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare release artifacts & SHA256 checksums
        shell: pwsh
        run: |
          $zipName = "NanoPing-${{ github.ref_name }}-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist/bundle | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/NanoPing.exe" "dist/NanoPing.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/NanoPing.exe" "dist/bundle/NanoPing.exe"
          Copy-Item "config.ini" "dist/bundle/config.ini"
          Copy-Item "LICENSE" "dist/bundle/LICENSE"
          Compress-Archive -Path "dist/bundle/*" -DestinationPath "dist/$zipName" -Force

          $lines = @("NanoPing.exe", $zipName) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path "dist/$_").Hash.ToLower()
            "$hash  $_"
          }
          [System.IO.File]::WriteAllLines("$PWD/dist/SHA256SUMS.txt", $lines)

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NanoPing.exe
            dist/NanoPing-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt